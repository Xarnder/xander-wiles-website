<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <defs>
    <style>
      .cls-1 { fill: url(#grad-a); }
      .cls-2 { fill: url(#grad-b); }
    </style>
    <linearGradient id="grad-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#112233"/>
      <stop offset="0.5" stop-color="#445566"/>
      <stop offset="1" stop-color="#AABBCC"/>
    </linearGradient>
    <linearGradient id="grad-b" xlink:href="#grad-a"/>
  </defs>
  <rect class="cls-1" width="40" height="40" x="0" y="0"/>
  <rect class="cls-2" width="40" height="40" x="50" y="50"/>
</svg>
