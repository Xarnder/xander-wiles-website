<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>360° VR Viewer</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <link rel="stylesheet" href="shared/viewer.css">

    <link rel="icon" href="favicon.ico" sizes="any">

    <meta name="theme-color" content="#111115">
    <script>
        document.documentElement.classList.toggle(
            'is-slim-mobile',
            window.matchMedia('(max-width: 600px) and (orientation: portrait), (max-height: 500px) and (orientation: landscape) and (pointer: coarse)').matches
        );
    </script>
</head>
<body>
<script>
    if (document.documentElement.classList.contains('is-slim-mobile')) {
        document.body.classList.add('is-ui-hidden');
    }
</script>
    <div id="viewer-mount"></div>
    <script>
        window.PANORAMA_VIEWER = {
            title: '360° VR Viewer',
            assetFolder: 'assets/360-images/',
            manifestUrl: 'assets/360-images/manifest.json',
            storageNamespace: 'xw-360',
            collections: [
                {
                    manifestUrl: 'assets/360-images/manifest.json',
                    assetFolder: 'assets/360-images/'
                },
                {
                    title: 'Guildford Cathedral',
                    manifestUrl: 'guildford-cathedral/images/manifest.json',
                    assetFolder: 'guildford-cathedral/images/'
                }
            ]
        };
    </script>
    <script src="shared/config.js"></script>
    <script src="shared/boot.js"></script>
</body>
</html>
