<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			try {
				const theme = localStorage.getItem('still-theme');
				if (theme === 'light' || theme === 'oled' || theme === 'dark') {
					document.documentElement.dataset.theme = theme;
					const meta = document.querySelector('meta[name="theme-color"]');
					if (meta) {
						meta.setAttribute(
							'content',
							theme === 'light' ? '#f6f5ee' : theme === 'oled' ? '#000000' : '#101918'
						);
					}
				}
			} catch {
				/* Use the default theme when storage is unavailable. */
			}
		</script>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#101918" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" href="%sveltekit.assets%/icons/favicon.ico" sizes="any" />
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/icons/favicon-16x16.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/icons/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="%sveltekit.assets%/icons/favicon-light.svg"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="%sveltekit.assets%/icons/favicon-dark.svg"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/icons/apple-touch-icon.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
