<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quest 3 AR Studio</title>
    
    <!-- YOUR SITE HEADER CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">
    <!-- LOCAL AR STYLES -->
    <link rel="stylesheet" href="style.css">

    <!-- Theme-aware SVG icons (modern browsers) -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
    <link rel="icon" href="favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">

    <!-- Fallback PNG icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <!-- Other essential links -->
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111115" media="(prefers-color-scheme: dark)">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
                "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
            }
        }
    </script>
</head>
<body>
    <!-- YOUR SITE NAVIGATION -->
    <div id="main-nav-placeholder"></div> 
    <script src="/assets/js/nav-loader.js"></script>

    <!-- 2D INSTRUCTIONS CARD -->
    <div id="instructions-card">
        <h2>AR Controls</h2>
        <ul>
            <li><strong>Trigger</strong>: Spawn Model on Surface</li>
            <li><strong>Hold 'A'</strong>: Drag Model</li>
            <li><strong>Left Stick ↕</strong>: Adjust Height</li>
            <li><strong>Right Stick ↕</strong>: Scale Size</li>
            <li><strong>Right Stick ↔</strong>: Rotate</li>
            <li><strong>Button 'B'</strong>: Open / Close 3D Menu</li>
        </ul>
        <div style="margin-top: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 16px;">
            <input type="file" id="file-input" accept=".glb,.gltf,.ply,.splat,.ksplat,.spz" style="display: none;">
            <button id="upload-btn" class="upload-btn">Upload Custom Model / Splat</button>
            <div id="upload-status" style="font-size: 0.85rem; color: #4a90e2; margin-top: 10px;">Default: Fighter Jet</div>
        </div>
    </div>

    <!-- AR UI CONTAINER (Holds START AR button) -->
    <div id="ar-button-container"></div>
    
    <!-- MAIN APP SCRIPT -->
    <script type="module" src="script.js"></script>
</body>
</html>
